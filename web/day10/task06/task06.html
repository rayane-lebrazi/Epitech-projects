<body class="bg-light">
  <main class="container py-5">
    <a class="btn btn-sm btn-outline-secondary mb-4" href="../index.html">Day 10 tasks</a>
    <h1 class="mb-3">Task 06 — Add or update product</h1><p>Enter an existing type and a brand. The database adds a new type-brand product or updates the existing product’s price and stock. Zero is allowed for price and stock.</p><form id="product-form" class="row g-3"><div class="col-sm-6"><label class="form-label" for="type">Type</label><input class="form-control" id="type" name="type" required></div><div class="col-sm-6"><label class="form-label" for="brand">Brand</label><input class="form-control" id="brand" name="brand" required></div><div class="col-sm-6"><label class="form-label" for="price">Price</label><input class="form-control" id="price" name="price" type="number" min="0" step="1" required></div><div class="col-sm-6"><label class="form-label" for="number">Stock</label><input class="form-control" id="number" name="number" type="number" min="0" step="1" required></div><div class="col-12"><button class="btn btn-primary" type="submit">Save product</button></div></form><p id="status" class="mt-3" role="status"></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
