<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 02 — POST email</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
  <main class="container py-5">
    <a class="btn btn-sm btn-outline-secondary mb-4" href="../index.html">Day 10 tasks</a>
<h1 class="mb-3">Task 02 — POST email</h1><p>Submit an email address for server-side validation.</p><form id="email-form" class="row g-2" novalidate><div class="col-sm-8"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" required></div><div class="col-sm-4 d-flex align-items-end"><button class="btn btn-primary w-100" type="submit">Validate email</button></div></form><p id="status" class="mt-3" role="status"></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
  <script>
const form = document.querySelector('#email-form');
const status = document.querySelector('#status');
form.addEventListener('submit', async (event) => {
  event.preventDefault();
  try {
    const response = await fetch('task02.php', { method: 'POST', body: new FormData(form), headers: { Accept: 'application/json' } });
    const data = await response.json();
    status.textContent = data.message;
    status.className = `mt-3 ${data.valid ? 'text-success' : 'text-danger'}`;
    window.alert(data.message);
  } catch (error) {
    status.textContent = 'An error occurred while contacting the server.';
    status.className = 'mt-3 text-danger';
    window.alert('An error occurred.');
  }
});
</script>
</body>
</html>
