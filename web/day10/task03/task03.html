<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 03 — Countries</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
  <main class="container py-5">
    <a class="btn btn-sm btn-outline-secondary mb-4" href="../index.html">Day 10 tasks</a>
    <h1 class="mb-3">Task 03 — Countries</h1><p>Load country codes and names from the provided JSON file.</p><button id="load-countries" class="btn btn-primary" type="button">Load countries</button><p id="status" class="mt-3" role="status"></p><div class="table-responsive mt-3"><table class="table table-striped table-bordered"><thead><tr><th scope="col">Country code</th><th scope="col">Name</th></tr></thead><tbody id="countries"></tbody></table></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
  <script>
document.querySelector('#load-countries').addEventListener('click', async () => {
  const status = document.querySelector('#status');
  const table = document.querySelector('#countries');
  table.replaceChildren();
  status.textContent = '';
  try {
    const response = await fetch('countries.json');
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const countries = await response.json();
    for (const [code, name] of Object.entries(countries).sort(([a], [b]) => a.localeCompare(b))) {
      const row = document.createElement('tr');
      const codeCell = document.createElement('td');
      const nameCell = document.createElement('td');
      codeCell.textContent = code;
      nameCell.textContent = name;
      row.append(codeCell, nameCell);
      table.append(row);
    }
    status.textContent = `${table.rows.length} countries loaded.`;
  } catch (error) {
    status.textContent = 'Could not load countries.';
    status.className = 'mt-3 text-danger';
  }
});
</script>
</body>
</html>
