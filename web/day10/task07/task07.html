<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 07 — Async chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
  <main class="container py-5">
    <a class="btn btn-sm btn-outline-secondary mb-4" href="../index.html">Day 10 tasks</a>
    <h1 class="mb-3">Task 07 — Async chat</h1><p class="text-muted">Messages refresh every four seconds.</p><form id="chat-form" class="row g-2"><div class="col-md-4"><label class="form-label" for="name">Name</label><input class="form-control" id="name" name="name" maxlength="60" required></div><div class="col-md-6"><label class="form-label" for="message">Message</label><input class="form-control" id="message" name="message" maxlength="500" required></div><div class="col-md-2 d-flex align-items-end"><button class="btn btn-primary w-100" type="submit">Send</button></div></form><p id="status" class="mt-3" role="status"></p><section id="messages" class="list-group mt-3" aria-live="polite" aria-label="Chat messages"></section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
  <script src="task07.js"></script>
</body>
</html>
