<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 01 — GET JSON</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
  <main class="container py-5">
    <a class="btn btn-sm btn-outline-secondary mb-4" href="../index.html">Day 10 tasks</a>
    <h1 class="mb-3">Task 01 — GET JSON</h1><p>Enter a name. The page sends it to PHP and shows the returned value.</p><form id="name-form" class="row g-2"><div class="col-sm-8"><label class="form-label" for="name">Name</label><input class="form-control" id="name" name="name" type="text" required></div><div class="col-sm-4 d-flex align-items-end"><button class="btn btn-primary w-100" type="submit">Send GET request</button></div></form><p id="status" class="mt-3" role="status"></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
  <script>
const form = document.querySelector('#name-form');
const status = document.querySelector('#status');
form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const name = new FormData(form).get('name').trim();
  try {
    const response = await fetch(`task01.php?name=${encodeURIComponent(name)}`, { headers: { Accept: 'application/json' } });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const data = await response.json();
    status.textContent = `The server received: ${data.name}`;
    window.alert(data.name);
  } catch (error) {
    status.textContent = 'An error occurred while contacting the server.';
    window.alert('An error occurred.');
  }
});
</script>
</body>
</html>
