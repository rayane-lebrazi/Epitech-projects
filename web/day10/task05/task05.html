<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 05 — Product search</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body class="bg-light">
  <main class="container py-5">
    <a class="btn btn-sm btn-outline-secondary mb-4" href="../index.html">Day 10 tasks</a>
    <h1 class="mb-3">Task 05 — Product search</h1><p>Search the stock by type, brand, price condition and requested quantity.</p><form id="search-form" class="row g-3"><div class="col-sm-6 col-lg-3"><label class="form-label" for="type">Type</label><input class="form-control" id="type" name="type" required></div><div class="col-sm-6 col-lg-3"><label class="form-label" for="brand">Brand</label><input class="form-control" id="brand" name="brand" required></div><div class="col-sm-6 col-lg-3"><label class="form-label" for="price">Price (e.g. &gt;100)</label><input class="form-control" id="price" name="price" placeholder="&gt;100" required></div><div class="col-sm-6 col-lg-3"><label class="form-label" for="number">Number</label><input class="form-control" id="number" name="number" type="number" min="1" step="1" required></div><div class="col-12"><button class="btn btn-primary" type="submit">Search products</button></div></form><p id="error" class="mt-3 text-danger" role="alert"></p><div class="table-responsive"><table class="table table-striped" id="results"><thead><tr><th>Type</th><th>Brand</th><th>Price</th><th>Number</th><th>Stock</th></tr></thead><tbody></tbody></table></div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
  <script src="task05.js"></script>
</body>
</html>
