<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task 15 - Tagged item list</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>My items</h1>
    <form id="itemForm">
      <label for="itemText">New item</label><input id="itemText" type="text" required>
      <label for="itemType">Type</label><select id="itemType"><option value="note">Note</option><option value="email">Email</option><option value="todo">Todo</option></select>
      <label for="itemTags">Tags (comma-separated)</label><input id="itemTags" type="text" placeholder="urgent, work">
      <button type="submit">Add item</button>
    </form>
    <form id="filterForm">
      <label for="typeFilter">Types (Ctrl/Cmd-click to select several)</label>
      <select id="typeFilter" multiple size="3"><option value="note">Note</option><option value="email">Email</option><option value="todo">Todo</option></select>
      <label for="wordFilter">Contains any of these words (comma-separated)</label><input id="wordFilter" type="search" placeholder="rick, trick">
      <label for="tagFilter">Must have tag(s) (comma-separated)</label><input id="tagFilter" type="search" placeholder="urgent">
      <label for="excludeTagFilter">Must not have tag(s) (comma-separated)</label><input id="excludeTagFilter" type="search" placeholder="done">
      <button type="submit">Search</button><button type="reset">Reset</button>
    </form>
    <ul id="itemList"></ul>
  </main>
</body>
</html>
